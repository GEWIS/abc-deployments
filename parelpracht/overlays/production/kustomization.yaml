apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: parelpracht-prod

resources:
  - ../../base
  - backend-config.yaml
  - backend-sealed-secret.yaml

patches:
  - target:
      kind: PersistentVolumeClaim
      name: backend-files
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 2Gi
  - target:
      kind: PersistentVolumeClaim
      name: media
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 512Mi

images:
  - name: abc.docker-registry.gewis.nl/crm/parelpracht/client
    newTag: "1.5.0"
  - name: abc.docker-registry.gewis.nl/crm/parelpracht/server
    newTag: "1.5.0"
