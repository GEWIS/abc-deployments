---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    io.kompose.service: frontend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      io.kompose.service: frontend
  template:
    metadata:
      labels:
        io.kompose.service: frontend
    spec:
      containers:
        - name: frontend
          image: abc.docker-registry.gewis.nl/crm/parelpracht/client:1.5.0
          ports:
            - containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: media
              mountPath: /usr/src/app/data/logos
              subPath: logos
            - name: media
              mountPath: /usr/src/app/data/backgrounds
              subPath: backgrounds
      restartPolicy: Always
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    io.kompose.service: frontend
spec:
  selector:
    io.kompose.service: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
