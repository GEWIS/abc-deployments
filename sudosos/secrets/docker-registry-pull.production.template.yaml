apiVersion: v1
kind: Secret
metadata:
  name: docker-registry-pull
  namespace: sudosos-prod
type: kubernetes.io/dockerconfigjson
stringData:
  # Generate with:
  #   kubectl create secret docker-registry docker-registry-pull \
  #     --docker-server=abc.docker-registry.gewis.nl \
  #     --docker-username=REPLACE_ME \
  #     --docker-password=REPLACE_ME \
  #     --docker-email=REPLACE_ME \
  #     --dry-run=client -o yaml
  # or edit the JSON below directly.
  .dockerconfigjson: |
    {"auths":{"abc.docker-registry.gewis.nl":{"username":"CHANGE_ME","password":"CHANGE_ME"}}}
