apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: grooster-test

resources:
  - ../../base
  - backend-config.yaml
  - backend-sealed-secret.yaml

patches:
  - target:
      kind: Ingress
      name: grooster
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: grooster.test.gewis.nl

images:
  - name: abc.docker-registry.gewis.nl/eou/grooster-backend
    newTag: "1.21.1"
  - name: abc.docker-registry.gewis.nl/eou/grooster-frontend
    newTag: "1.22.0"
