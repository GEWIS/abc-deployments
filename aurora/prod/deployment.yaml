apiVersion: apps/v1
kind: Deployment
metadata:
  name: backoffice
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: backoffice
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: backoffice
    spec:
      containers:
        - name: backoffice
          image: ghcr.io/gewis/aurora/backoffice:2.14.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: 80tcp
              protocol: TCP
          volumeMounts:
            - mountPath: /usr/src/app/data/posters
              name: posters
            - mountPath: /usr/src/app/data/local-posters
              name: local-posters
            - mountPath: /usr/src/app/data/audio
              name: audio
      volumes:
        - name: posters
          persistentVolumeClaim:
            claimName: posters
        - name: local-posters
          persistentVolumeClaim:
            claimName: local-posters
        - name: audio
          persistentVolumeClaim:
            claimName: audio
---
